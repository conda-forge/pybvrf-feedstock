{% set version = "0.2.0" %}
{% set python_min = "3.12" %}

package:
  name: pybvrf
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pybvrf/pybvrf-{{ version }}.tar.gz
  sha256: 048966231734d1be41c7dedbe28041123ae77aae81c264c7308ac1c8e4f85714
  patches: patches/numpy-min.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build >=0.9.22,<0.10.0
    - pip
  run:
    - python >={{ python_min }}
    - jsonschema >=4.26.0
    - numpy >=2.2.0

test:
  imports:
    - pybvrf
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/pybvrf/
  summary: A Python package for working with BrainVision Recording Format (BVRF) files.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - larsoner
